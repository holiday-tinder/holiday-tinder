<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14111f">
  <title>Night Swipe &ndash; pick tonight's spot together</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/cards.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<main id="home" class="screen">
  <header class="hero">
    <div class="logo">&#x1F319;</div>
    <h1>Night Swipe</h1>
    <p>Swipe through restaurants, bars and clubs with your crew. When everyone likes a place, it's a match.</p>
  </header>

  <form id="create-form" class="panel">
    <label>Your name<input id="create-name" required maxlength="30" placeholder="e.g. Sam" autocomplete="given-name"></label>
    <label>Where are you heading?<select id="city"></select></label>
    <fieldset class="chips" id="categories">
      <legend>What are you in the mood for?</legend>
      <label class="chip"><input type="checkbox" value="restaurant" checked><span>&#x1F37D;&#xFE0F; Restaurants</span></label>
      <label class="chip"><input type="checkbox" value="bar" checked><span>&#x1F378; Bars</span></label>
      <label class="chip"><input type="checkbox" value="club" checked><span>&#x1FAA9; Clubs</span></label>
    </fieldset>
    <button class="btn primary" type="submit">Start a session</button>
  </form>

  <div class="divider"><span>or join your friends</span></div>

  <form id="join-form" class="panel">
    <label>Your name<input id="join-name" required maxlength="30" placeholder="e.g. Alex"></label>
    <label>Session code<input id="join-code" required maxlength="6" placeholder="ABC234" autocapitalize="characters" autocomplete="off" class="code-input"></label>
    <button class="btn secondary" type="submit">Join session</button>
  </form>
  <p class="error" id="home-error" hidden></p>
  <p class="footnote">Ratings shown as bubbles, TripAdvisor-style. Sample venues for demo purposes.</p>
</main>

<main id="swipe" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" id="leave" aria-label="Leave session">&larr;</button>
    <button class="code-pill" id="share" aria-label="Share session code">
      <span class="code-label">Code</span><strong id="session-code"></strong><span>&#x1F4E4;</span>
    </button>
    <button class="icon-btn" id="open-matches" aria-label="Matches">&#x1F498;<span class="badge" id="match-badge" hidden>0</span></button>
  </header>
  <p class="subhead" id="session-info"></p>
  <section class="deck" id="deck"></section>
  <div class="actions">
    <button class="round nope" id="btn-nope" aria-label="Nope">&#x2715;</button>
    <button class="round like" id="btn-like" aria-label="Like">&#x2665;</button>
  </div>
</main>

<div class="sheet" id="matches-sheet" hidden>
  <div class="sheet-body">
    <div class="sheet-head"><h2>Your crew's picks</h2><button class="icon-btn" id="close-matches" aria-label="Close">&#x2715;</button></div>
    <p class="muted" id="crew"></p>
    <ul id="matches-list" class="match-list"></ul>
  </div>
</div>

<div class="overlay" id="match-overlay" hidden>
  <div class="match-card">
    <div class="match-emoji" id="match-emoji"></div>
    <h2>It's a match!</h2>
    <p id="match-text"></p>
    <button class="btn primary" id="match-close">Keep swiping</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
</body>
</html>
